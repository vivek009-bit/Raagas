<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Carnatic ragas, Hindustani ragas, Arabic maqamat and Western scales on one playable keyboard, with every raga's name in each tradition.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ECEFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F160F" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raga Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Raga Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three working columns — finder | keyboard & scale | the raga's story. Palette from Kerala mural pigments: red oxide, ochre, malachite, indigo on pale lime-wash. */
:root{
  --bg:#ECEFE4; --surface:#F7F8F1; --sunk:#E2E6D8; --ink:#1C2118; --muted:#5A6253; --line:#CBD1BF;
  --accent:#A3361F; --ochre:#B07A12; --green:#2E5E3B; --indigo:#36467A;
  --kw:#FCFCF7; --kb:#1B1D18; --kline:#9EA592; --kon:#C9563A; --konb:#A3361F; --ksa:#D9A12B; --klit:#2E5E3B;
  --f-display:"Rozha One", "Noto Serif Devanagari", Georgia, serif;
  --f-body:"Hind", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F160F; --surface:#162016; --sunk:#1C281C; --ink:#E7EBDD; --muted:#9BA593; --line:#2C3A2B;
  --accent:#E57858; --ochre:#E0AE4A; --green:#7DB78B; --indigo:#93A4DD;
  --kw:#E3E1D3; --kb:#090B08; --kline:#5E6656; --kon:#D8694B; --konb:#B4462B; --ksa:#E0AE4A; --klit:#4E9B63;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F160F; --surface:#162016; --sunk:#1C281C; --ink:#E7EBDD; --muted:#9BA593; --line:#2C3A2B;
  --accent:#E57858; --ochre:#E0AE4A; --green:#7DB78B; --indigo:#93A4DD;
  --kw:#E3E1D3; --kb:#090B08; --kline:#5E6656; --kon:#D8694B; --konb:#B4462B; --ksa:#E0AE4A; --klit:#4E9B63;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sys-C{--sc:var(--accent)} .sys-H{--sc:var(--ochre)} .sys-A{--sc:var(--green)} .sys-W{--sc:var(--indigo)}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 28px;padding-block:22px 18px;border-bottom:1px solid var(--line);max-width:1480px;margin:0 auto}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4vw,42px);line-height:1;margin:0;letter-spacing:.005em}
.brand h1 span{color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--sc)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.ctl label{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ctl select{background:transparent;border:0;font-family:var(--f-mono);font-size:14px;padding:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--green);border-color:var(--green);color:var(--bg)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn svg{width:14px;height:14px;fill:currentColor}

.app{max-width:1480px;margin:22px auto 0;display:grid;gap:22px;
  grid-template-columns:minmax(260px,300px) minmax(0,1fr) minmax(280px,340px);
  grid-template-areas:"find main about";align-items:start}
.find{grid-area:find;position:sticky;top:env(safe-area-inset-top, 0px)}
.main{grid-area:main;min-width:0}
.about{grid-area:about;min-width:0}
@media (max-width:1180px){.app{grid-template-columns:minmax(250px,290px) minmax(0,1fr);grid-template-areas:"find main" "find about"}}
@media (max-width:780px){.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"find" "main" "about"}.find{position:static}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:12px 8px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.fbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{list-style:none;margin:0;padding:0 6px 8px;max-height:calc(100vh - 330px);min-height:220px;overflow:auto;border-top:1px solid var(--line)}
@media (max-width:780px){.list{max-height:360px}}
.list li button{width:100%;text-align:left;display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:transparent;padding:8px 8px;border-radius:6px;cursor:pointer}
.list li button:hover{background:var(--sunk)}
.list li button[aria-current="true"]{background:var(--sunk)}
.list .bar{width:4px;height:28px;border-radius:2px;background:var(--sc)}
.list .nm{font-weight:500;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .sub{font-size:12px;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.dots{display:grid;grid-template-columns:repeat(12,5px);gap:2px}
.dots i{width:5px;height:12px;border-radius:1px;background:var(--line)}
.dots i.on{background:var(--sc)}
.dots i.k{opacity:.9}
.count{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:14px 8px}

.notegrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.note{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.note b{font-weight:600;font-size:14px}
.note small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.note[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.note[aria-pressed="true"] small{color:#fff;opacity:.85}
.note.sa{background:var(--ochre);border-color:var(--ochre);color:#1c1608;cursor:default}
.note.sa small{color:#1c1608}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 4px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.minipiano{overflow-x:auto}
.minipiano svg{display:block;width:100%;height:auto;max-height:110px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12px;text-decoration:underline;text-underline-offset:2px}

/* main */
.rhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 18px;margin-bottom:14px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow .tag{background:var(--sc);color:var(--bg);padding:2px 8px;border-radius:3px;font-weight:600;letter-spacing:.08em}
.rname{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,5.2vw,60px);line-height:1.02;margin:6px 0 2px;text-wrap:balance}
.rname .script{font-family:"Noto Naskh Arabic","Geeza Pro",serif;font-size:.55em;color:var(--muted);margin-left:.3em}
.aka{color:var(--muted);font-size:14px}
.playbar{display:flex;gap:8px;flex-wrap:wrap}
.pianowrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 14px 12px;overflow-x:auto}
.pianowrap svg{display:block;width:100%;min-width:520px;height:auto}
.keyhint{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.keyhint span{display:inline-flex;gap:6px;align-items:center}
.keyhint i{width:12px;height:12px;border-radius:2px;display:inline-block}
.k{stroke:var(--kline);stroke-width:1;transition:fill .12s}
.k.w{fill:var(--kw)} .k.b{fill:var(--kb)}
.k.w.on{fill:var(--kon)} .k.b.on{fill:var(--konb)}
.k.sa{fill:var(--ksa)!important}
.k.mi{fill:url(#hatchmainPiano)!important}
.k.lit{fill:var(--klit)!important}
.k.off{opacity:.35}
.k.click{cursor:pointer}
.kl{font-family:var(--f-mono);font-size:10px;text-anchor:middle;pointer-events:none;font-weight:500}
.kl.w{fill:#fff} .kl.b{fill:#fff} .kl.saL{fill:#1c1608}
.kl.dim{fill:var(--kline)}

.scales{margin-top:16px;display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
@media (max-width:560px){.srow{grid-template-columns:minmax(0,1fr) auto}.srow .lab{grid-column:1 / -1}}
.lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:flex-end}
.tok{position:relative;font-family:var(--f-mono);font-size:15px;font-weight:500;padding:5px 7px 3px;border-radius:5px;background:var(--sunk);min-width:30px;text-align:center;line-height:1.2}
.tok sub{font-size:10px;margin-left:1px}
.tok.hi::after,.tok.lo::after{content:"";position:absolute;left:50%;width:4px;height:4px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
.tok.hi::after{top:1px} .tok.lo::after{bottom:-1px}
.tok.k{text-decoration:underline;text-underline-offset:3px}
.tok.t::before{content:"";position:absolute;top:0;left:50%;width:1.5px;height:5px;background:var(--ink)}
.tok.lit{background:var(--klit);color:#fff}
.tok.lit::after,.tok.lit::before{background:#fff}
.tok.plain{background:transparent;padding-inline:3px;min-width:0}
.steps{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:13px;height:13px;fill:var(--ink)}
.iconbtn:hover{border-color:var(--muted)}

h2.sec{font-family:var(--f-display);font-weight:400;font-size:24px;margin:30px 0 4px;line-height:1.15}
.secnote{color:var(--muted);font-size:13.5px;margin:0 0 12px;max-width:70ch}
.xgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:980px){.xgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.xgrid{grid-template-columns:minmax(0,1fr)}}
.xcol{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--sc);border-radius:8px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.xcol h3{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.xlink{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:500;color:var(--ink);font-size:15px;line-height:1.3}
.xlink:hover{color:var(--sc);text-decoration:underline;text-underline-offset:2px}
.xlink small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.xnone{color:var(--muted);font-size:13px}
.approx{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:4px}

.graha{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.grow:first-child{border-top:0}
.grow .from{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.grow .to{display:flex;flex-wrap:wrap;gap:4px 14px}
.inline-sys{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--sc);margin-right:6px;vertical-align:1px}
.bandh{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
@media (max-width:980px){.band{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.band{grid-template-columns:minmax(0,1fr)}}
.bcell{padding:10px 12px 12px;border-left:1px solid var(--line);border-top:3px solid var(--sc);display:flex;flex-direction:column;gap:6px;min-width:0;margin-top:-1px}
.bcell:first-child{border-left:0}
@media (max-width:980px){.bcell:nth-child(3){border-left:0}}
@media (max-width:440px){.bcell{border-left:0}}
.blab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sc);font-weight:600}
.bself{font-family:var(--f-display);font-size:19px;line-height:1.2}
.xlink.apx{color:var(--muted);font-style:italic}
.xlink.apx small{font-style:normal}
.band + .secnote{margin:8px 0 16px}
.app.wide{grid-template-columns:minmax(260px,300px) minmax(0,1fr);grid-template-areas:"find main"}
@media (max-width:780px){.app.wide{grid-template-columns:minmax(0,1fr);grid-template-areas:"find" "main"}}
.ctable{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ctable table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.ctable th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:9px 12px;font-weight:600;border-bottom:1px solid var(--line)}
.ctable td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.ctable td .xlink{display:block;font-size:14px;margin-bottom:2px}
.ctable td.nil{color:var(--line)}
.ncell{display:flex;flex-direction:column;gap:4px;min-width:150px}
.ncell .dots i{height:9px}
.sw-c{font-family:var(--f-mono);font-size:11.5px;color:var(--ink)}
.sw-w{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.fam{display:flex;flex-wrap:wrap;gap:6px}
.fam .xlink{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;background:var(--surface)}

/* about */
.about .panel{padding:18px 18px 20px}
.about h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 2px}
.about .meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.blk{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.blk h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sc);font-weight:600}
.blk p{margin:0;font-size:14.5px;max-width:65ch}
.comps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.comps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.comps li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sc);transform:translateY(-2px)}
.comps b{font-weight:600;display:block;line-height:1.3}
.comps span{font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.note-src{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.45}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Raga <span>Atlas</span></h1>
    <p id="tagline">One keyboard for four traditions. Find a raga by name or by its notes, and see what it is called elsewhere.</p>
    <div class="legend">
      <span class="sys-C"><i></i>Carnatic</span><span class="sys-H"><i></i>Hindustani</span><span class="sys-A"><i></i>Arabic maqam</span><span class="sys-W"><i></i>Western</span>
    </div>
  </div>
  <div class="controls">
    <div class="ctl"><label for="tonic">Sa =</label><select id="tonic" aria-label="Pitch of Sa (tonic)"></select></div>
    <button class="btn" id="installBtn" hidden><svg viewBox="0 0 16 16"><path d="M7 1h2v8l3-3 1.4 1.4L8 12.8 2.6 7.4 4 6l3 3zM2 13h12v2H2z"/></svg>Install app</button>
    <button class="btn" id="tableBtn" aria-pressed="false" title="Every note set with its name in each tradition"><svg viewBox="0 0 16 16"><path d="M1 2h14v3H1zM1 7h14v3H1zM1 12h14v3H1z"/></svg>Name concordance</button>
    <button class="btn" id="drone" aria-pressed="false" title="Tanpura-style drone on Sa and Pa"><svg viewBox="0 0 16 16"><path d="M7 2h2v12H7zM3 6h2v8H3zM11 4h2v10h-2z"/></svg>Drone</button>
  </div>
</header>

<div class="app">
  <aside class="find panel" aria-label="Find a raga">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-name" aria-selected="true" aria-controls="pane-name">Search by name</button>
      <button role="tab" id="tab-notes" aria-selected="false" aria-controls="pane-notes">Find by notes</button>
    </div>
    <div id="pane-name" role="tabpanel" aria-labelledby="tab-name">
      <div class="fbody">
        <input id="q" class="search" type="search" placeholder="Kalyani, Yaman, Hijaz, Dorian…" autocomplete="off" aria-label="Search raga, maqam or scale name">
        <div class="chips" id="sysf"></div>
        <div class="count" id="qcount"></div>
      </div>
      <ul class="list" id="nlist"></ul>
    </div>
    <div id="pane-notes" role="tabpanel" aria-labelledby="tab-notes" hidden>
      <div class="fbody">
        <div class="row2"><span class="lab">Tap keys or swaras</span><button class="link" id="clearN">Clear</button></div>
        <div class="minipiano" id="mpiano"></div>
        <div class="notegrid" id="ngrid"></div>
        <div class="row2"><span class="lab">Label swaras as</span>
          <div class="chips" id="lblstyle"></div></div>
        <div class="seg" id="mmode" role="group" aria-label="Match type">

/* ---------------- concordance ---------------- */

const BLACK=new Set([1,3,6,8,10]);
function pianoSVG({set,from,to,labels={},clickable=false,activeRange=null,selected=null,id=""}){

  for(let a=from;a<=to;a++){const p=pcOf(a);if(BLACK.has(p)){blacks.push({a,x:wi*WW-BW/2})}else{whites.push({a,x:wi*WW});wi++}}
  const W=wi*WW;
  const rel=a=>a-state.tonic; // relative semitone to Sa
  const status=a=>{
    const rv=rel(a), pc=pcOf(rv);
    const inR=!activeRange||(rv>=activeRange[0]&&rv<=activeRange[1]);
    let on=false,mi=false;
    if(selected){on=selected.has(pc)&&inR}
    else{on=set.includes(pc);mi=set.some(v=>v%1&&(Math.floor(v)===pc||Math.ceil(v)%12===pc))&&!on}

    if(lab){t+=`<text class="kl ${s.sa?"saL":isB?"b":"w"}" x="${k.x+w/2}" y="${isB?BH-10:WH-12}">${esc(lab)}</text>`}

  <defs><pattern id="hatch${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--kw)"/><rect width="3" height="6" fill="var(--kon)"/></pattern></defs>${g.replace(/url\(#hatch\)/g,`url(#hatch${id})`)}</svg>`;
}

  clearLit();if(i<0||i>=n.length)return;
  const t=n[i],k=document.querySelector(`#mainPiano rect[data-abs="${state.tonic+Math.floor(t.v)}"]`);if(k)k.classList.add("lit");
  const up=which==="both"?i<r.aro.length:which==="aro",ti=which==="both"?(up?i:i-r.aro.length+1):i;

function renderNoteSearch(){
  const sel=state.notes;
  $("#mpiano").innerHTML=pianoSVG({set:[],from:state.tonic,to:state.tonic+12,labels:Object.fromEntries([...Array(12)].map((_,i)=>[i,genLabel(i,state.lbl).split("/")[0]])),clickable:true,activeRange:[0,12],selected:sel,id:"mp"});
  $("#ngrid").innerHTML=[...Array(12)].map((_,pc)=>{
    const lab=genLabel(pc,state.lbl);const sub=state.lbl==="W"?genLabel(pc,"C"):westName(pc);
    return `<button class="note${pc===0?" sa":""}" data-pc="${pc}" aria-pressed="${sel.has(pc)}" ${pc===0?'aria-disabled="true" title="Sa is always present"':""}><b>${esc(lab)}</b><small>${esc(sub)}</small></button>`}).join("");
  $("#lblstyle").innerHTML=[["C","Carnatic"],["H","Sargam"],["W","Letters"]].map(([k,l])=>`<button class="chip" data-l="${k}" aria-pressed="${state.lbl===k}">${l}</button>`).join("");
  document.querySelectorAll("#mmode button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===state.mode));
  // match
  const s=[...sel].sort((a,b)=>a-b);
  const pool=R.filter(r=>!r.micro);
  let res=[];
  if(state.mode==="exact")res=pool.filter(r=>r.key===s.join(",")).map(r=>({r}));
  else if(state.mode==="has")res=pool.filter(r=>s.every(p=>r.set.includes(p))).map(r=>({r,x:r.set.length-s.length})).sort((a,b)=>a.x-b.x);
  else res=pool.filter(r=>r.set.every(p=>sel.has(p))).map(r=>({r,x:s.length-r.set.length})).sort((a,b)=>a.x-b.x);
  res.sort((a,b)=>(a.x||0)-(b.x||0)||ORDER.indexOf(a.r.sys)-ORDER.indexOf(b.r.sys));
  let h=res.slice(0,150).map(({r})=>itemHTML(r,SYSN[r.sys]+" · "+(crossLine(r)||r.kind))).join("");
  let msg=`${res.length} match${res.length===1?"":"es"} for ${s.length} note${s.length>1?"s":""}`;
  if(!res.length){
    if(state.mode==="exact"&&s.length>1){
      const near=pool.map(r=>{const d=r.set.filter(p=>!sel.has(p)).length+s.filter(p=>!r.set.includes(p)).length;return{r,d}}).filter(x=>x.d===1).sort((a,b)=>ORDER.indexOf(a.r.sys)-ORDER.indexOf(b.r.sys));
      h=`<li class="empty">No exact match. ${near.length?"These differ by one note:":"Try “Has all these”."}</li>`+near.map(({r})=>itemHTML(r,SYSN[r.sys]+" · differs by one note")).join("");
    }else h=`<li class="empty">${s.length===1?"Add notes after Sa to start matching.":"Nothing matches. Try a different match type."}</li>`;
  }
  $("#ncount").textContent=msg+(state.mode!=="exact"?" · closest first":"")+" · quarter-tone maqamat are left out";
  $("#mlist").innerHTML=h;
}

/* ---------------- detail ---------------- */
function rowsFor(r){return r.sys==="C"?["Arohanam","Avarohanam"]:r.sys==="H"?["Aroh","Avroh"]:["Ascending","Descending"]}
function renderMain(){
  const app=document.querySelector(".app"),tb=$("#tableBtn");
  app.classList.toggle("wide",state.view==="table");$("#about").hidden=state.view==="table";
  tb.classList.toggle("on",state.view==="table");tb.setAttribute("aria-pressed",state.view==="table");
  if(state.view==="table"){renderConcordance();return}
  const r=BYID[state.sel];if(!r)return;
  const spelled=spellSet(r.set);
  const labels={};r.set.filter(v=>v%1===0).forEach(v=>{labels[v]=r.sys==="A"||r.sys==="W"?spelled[v]:nativeName(r,v,spelled)});
  r.set.filter(v=>v%1).forEach(v=>{const lo=Math.floor(v),hi=Math.ceil(v)%12;labels[labels[lo]===undefined?lo:hi]=spelled[v]});
  const [l1,l2]=rowsFor(r);
  const steps=stepsOf(r.set);
  const westRow=r.set.map(v=>`<span class="tok plain">${esc(spelled[v])}</span>`).join("");
  const sargamRow=(r.sys==="C"||r.sys==="H")?"":r.set.filter(v=>v%1===0).map(v=>`<span class="tok plain">${esc(r.sys==="W"||r.sys==="A"?C_GEN[v]:"")}</span>`).join("");
  let h=`<div class="rhead sys-${r.sys}"><div><div class="eyebrow"><span class="tag">${SYSN[r.sys]}</span>${esc(r.kind)}</div>
    <h1 class="rname">${esc(r.name)}${r.ar?`<span class="script" lang="ar">${r.ar}</span>`:""}</h1>
    ${r.aka.length?`<div class="aka">Also: ${esc(r.aka.join(", "))}</div>`:""}</div>
    <div class="playbar"><button class="btn primary" data-play="both">${PLAY.replace("<svg",'<svg aria-hidden="true"')}Play up &amp; down</button></div></div>
  <h2 class="bandh">Names in each tradition</h2>
  ${nameBand(r)}
  ${r.micro?`<p class="secnote">This maqam uses quarter tones, which a piano cannot play, so the other traditions are matched by rounding each quarter tone down or up.</p>`:`<p class="secnote">Same notes, different names. <b>≈</b> marks a near match, with the difference noted. Each tradition phrases and ornaments the notes in its own way.</p>`}
  <div class="pianowrap">${pianoSVG({set:r.set,from:state.tonic-2,to:state.tonic+14,labels,id:"mainPiano"})}
    <div class="keyhint"><span><i style="background:var(--ksa)"></i>Sa (${esc(TONICS[state.tonic][0])})</span><span><i style="background:var(--kon)"></i>Notes of the raga</span>${r.micro?`<span><i style="background:repeating-linear-gradient(45deg,var(--kon) 0 3px,var(--kw) 3px 6px)"></i>Quarter tone sits between the two hatched keys</span>`:""}<span><i style="background:var(--klit)"></i>Now playing</span></div></div>
  <div class="scales">
    <div class="srow" data-row="aro"><span class="lab">${l1}</span><div class="sw">${r.aro.map((t,i)=>tokHTML(r,t,spelled,i)).join("")}</div><button class="iconbtn" data-play="aro" data-label="Play ${l1}" aria-label="Play ${l1}">${PLAY}</button></div>
    <div class="srow" data-row="ava"><span class="lab">${l2}</span><div class="sw">${r.ava.map((t,i)=>tokHTML(r,t,spelled,i)).join("")}</div><button class="iconbtn" data-play="ava" data-label="Play ${l2}" aria-label="Play ${l2}">${PLAY}</button></div>
    ${r.sys==="C"||r.sys==="H"?`<div class="srow"><span class="lab">Western, Sa = ${esc(TONICS[state.tonic][0])}</span><div class="sw">${westRow}</div><span></span></div>`:`<div class="srow"><span class="lab">Carnatic swaras</span><div class="sw">${r.set.map(v=>`<span class="tok plain">${v%1?"~":""}${esc(C_GEN[Math.round(v)%12])}</span>`).join("")}</div><span></span></div>`}
    <div class="srow"><span class="lab">Intervals</span><div class="steps">${steps.join(" · ")} <span style="opacity:.7">semitones · ${r.set.length} notes${r.set.length===5?" (audava)":r.set.length===6?" (shadava)":r.set.length===7?" (sampurna)":""}</span></div><span></span></div>
  </div>`;
  // family
  const fam=familyHTML(r);if(fam)h+=fam;
  // graha
  if(!r.micro){
    const rows=r.set.filter(p=>p!==0).map(p=>{const rot=r.set.map(v=>pcOf(v-p)).sort((a,b)=>a-b);const m=BYSET.get(rot.join(","))||[];return{p,m}}).filter(x=>x.m.length);
    h+=`<h2 class="sec">${r.sys==="C"?"Graha bhedam":"Shift the tonic"}</h2><p class="secnote">Keep the same notes but treat another one as Sa. Carnatic theory calls this graha bhedam; in Western terms it is a mode rotation.</p>`;
    h+=rows.length?`<div class="graha">${rows.map(({p,m})=>`<div class="grow"><span class="from">Sa → ${esc(nativeName(r,p,spelled))}</span><span class="to">${pickRot(m).map(x=>`<button class="xlink sys-${x.sys}" data-id="${x.id}"><span class="inline-sys"></span>${esc(x.name)}</button>`).join("")}</span></div>`).join("")}</div>`:`<p class="xnone">No other scale in the atlas comes from rotating this one.</p>`;
  }
  $("#main").innerHTML=h;
}
function pickRot(m){const seen=new Set();return m.filter(x=>{const k=x.sys+(x.mela?"m":"");if(x.sys==="C"&&!x.mela)return true;if(seen.has(k))return false;seen.add(k);return true}).slice(0,6)}
function xGrid(list,set){
  return `<div class="xgrid">${ORDER.map(s=>{
    const items=list.filter(x=>x.sys===s);
    let inner=items.map(x=>`<button class="xlink" data-id="${x.id}">${esc(x.name)}<small>${esc(x.kind)}</small></button>`).join("");
    if(!items.length){
      const near=R.filter(x=>x.sys===s&&!x.micro&&set&&(x.set.filter(p=>!set.includes(p)).length+set.filter(p=>!x.set.includes(p)).length)===1).slice(0,2);
      inner=`<span class="xnone">No exact match</span>`+(near.length?`<span class="approx">One note away</span>`+near.map(x=>`<button class="xlink" data-id="${x.id}">${esc(x.name)}<small>${esc(x.kind)}</small></button>`).join(""):"");
    }
    return `<div class="xcol sys-${s}"><h3>${SYSN[s]}</h3>${inner}</div>`}).join("")}</div>`;
}
function familyHTML(r){
  let title="",items=[];
  if(r.parentMela){title="Parent melakarta";items=[MELA_BY_N[r.parentMela]]}
  else if(r.mela){items=R.filter(x=>x.parentMela===r.mela);title="Janya ragas in this atlas"}
  else if(r.isThaat){items=R.filter(x=>x.th===r.thaatName);title="Ragas of this thaat in the atlas"}
  else if(r.th&&r.th!=="—"){items=R.filter(x=>x.isThaat&&x.thaatName===r.th);title="Parent thaat"}
  if(!items.length)return"";
  return `<h2 class="sec">${title}</h2><div class="fam">${items.map(x=>`<button class="xlink sys-${x.sys}" data-id="${x.id}"><span class="inline-sys"></span>${esc(x.name)}</button>`).join("")}</div>`;
}
function renderAbout(){
  const r=BYID[state.sel];
  const comps=r.comps&&r.comps.length?`<ul class="comps">${r.comps.map(c=>`<li><div><b>${esc(c.t)}</b><span>${esc(c.by)}</span></div></li>`).join("")}</ul>`+(r.compsGeneric?`<p class="note-src" style="margin-top:8px">No widely known stand-alone piece is listed for this melakarta; these works cover all 72.</p>`:""):`<p class="xnone">${r.isThaat?"A thaat is a classification frame rather than a performed raga; see the ragas grouped under it.":"No single well-documented composition is listed here."}</p>`;
  const facts=[];
  if(r.mela)facts.push(["Number",`${r.mela} of 72`],["Chakra",r.chakra]);
  if(r.parentMela)facts.push(["Parent",`${MELA[r.parentMela-1]} (${r.parentMela})`]);
  if(r.th&&r.th!=="—")facts.push(["Thaat",r.th]);
  if(r.time)facts.push(["Time",r.time]);
  if(r.mood)facts.push(["Mood",r.mood]);
  facts.push(["Notes",`${r.set.length}`]);
  $("#about").innerHTML=`<div class="panel sys-${r.sys}">
    <h2>${esc(r.name)}</h2><div class="meta">${SYSN[r.sys]} · ${esc(r.kind)}</div>
    <dl class="facts">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="blk"><h3>Origin</h3><p>${esc(r.origin||"Traditional.")}</p></div>
    <div class="blk"><h3>Named or created by</h3><p>${esc(r.coined||"Traditional; no single originator.")}</p></div>
    <div class="blk"><h3>Compositions</h3>${comps}</div>
    <div class="blk"><h3>Character</h3><p>${esc(r.desc||"")}</p></div>
    <p class="note-src">Scales show the raga's skeleton only. Gamaka, phrasing, emphasised notes and rasa are what make a raga, and two ragas with identical notes can sound entirely different.</p>
  </div>`;
}

/* ---------------- wiring ---------------- */
function select(id,push=true){if(!BYID[id])return;stopPlay();state.sel=id;state.view="raga";renderMain();renderAbout();
  document.querySelectorAll(".list button[aria-current]").forEach(b=>b.removeAttribute("aria-current"));document.querySelectorAll(`.list button[data-id="${id}"]`).forEach(b=>b.setAttribute("aria-current","true"));
  if(push&&location.hash.slice(1)!==id){try{history.replaceState(null,"","#"+id)}catch(e){location.hash=id}}
  if(window.innerWidth<=780&&push)$("#main").scrollIntoView({behavior:"smooth",block:"start"});
}
function setTab(t){state.tab=t;$("#tab-name").setAttribute("aria-selected",t==="name");$("#tab-notes").setAttribute("aria-selected",t==="notes");$("#pane-name").hidden=t!=="name";$("#pane-notes").hidden=t!=="notes";if(t==="notes")renderNoteSearch()}
$("#tonic").innerHTML=TONICS.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join("");$("#tonic").value=state.tonic;
$("#tonic").addEventListener("change",e=>{state.tonic=+e.target.value;try{localStorage.setItem("ra-tonic",state.tonic)}catch(_){}stopPlay();renderMain();if(state.tab==="notes")renderNoteSearch()});
$("#drone").addEventListener("click",()=>{if(droneOn||$("#drone").classList.contains("on"))stopDrone();else startDrone()});
$("#tab-name").addEventListener("click",()=>setTab("name"));$("#tab-notes").addEventListener("click",()=>setTab("notes"));
$("#q").addEventListener("input",e=>{state.q=e.target.value;renderNameList()});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){const b=$("#nlist button[data-id]");if(b)select(b.dataset.id)}});
$("#sysf").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b)return;state.sys=b.dataset.s;renderSysChips();renderNameList()});
document.addEventListener("click",e=>{
  const sel=e.target.closest("[data-id]");if(sel&&!e.target.closest("rect")){select(sel.dataset.id);return}
  const pl=e.target.closest("[data-play]");if(pl){const r=BYID[state.sel];playSeq(r,pl.dataset.play,pl.classList.contains("iconbtn")?pl:null);return}
});
function toggleNote(pc){if(pc===0)return;state.notes.has(pc)?state.notes.delete(pc):state.notes.add(pc);if(state.notes.has(pc))ready().then(a=>{if(a)voice(freq(pc),a.currentTime+.02,{dur:.9})});renderNoteSearch()}
$("#ngrid").addEventListener("click",e=>{const b=e.target.closest("[data-pc]");if(b)toggleNote(+b.dataset.pc)});
$("#mpiano").addEventListener("click",e=>{const k=e.target.closest("rect.click");if(k)toggleNote(+k.dataset.pc)});
$("#mpiano").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("rect.click")){e.preventDefault();const pc=+e.target.dataset.pc;toggleNote(pc);const n=document.querySelector(`#mpiano rect.click[data-pc="${pc}"]`);if(n)n.focus()}});
$("#lblstyle").addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(!b)return;state.lbl=b.dataset.l;try{localStorage.setItem("ra-lbl",state.lbl)}catch(_){}renderNoteSearch()});
$("#mmode").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;state.mode=b.dataset.m;renderNoteSearch()});
$("#clearN").addEventListener("click",()=>{state.notes=new Set([0]);renderNoteSearch()});
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(id==="concordance"){if(state.view!=="table")showTable(false)}else if(BYID[id]&&(id!==state.sel||state.view!=="raga"))select(id,false)});
function showTable(push=true){stopPlay();state.view="table";renderMain();if(push){try{history.replaceState(null,"","#concordance")}catch(e){location.hash="concordance"}}window.scrollTo({top:0,behavior:"smooth"})}
$("#tableBtn").addEventListener("click",()=>{if(state.view==="table")select(state.sel);else showTable()});

// start: Mayamalavagowla's notes pre-selected in the note finder as an example
state.notes=new Set(BYID["c-mayamalavagowla"].set);
const h0=location.hash.slice(1);if(BYID[h0])state.sel=h0;if(h0==="concordance")state.view="table";
renderSysChips();renderNameList();renderMain();renderAbout();
</script>

<script>
/* installable-app glue */
(function(){
  if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  const btn=document.getElementById("installBtn");let deferred=null;
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  const iOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(standalone)return;
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;btn.hidden=false});
  addEventListener("appinstalled",()=>{btn.hidden=true;deferred=null});
  if(iOS)btn.hidden=false;
  btn.addEventListener("click",async()=>{
    if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;btn.hidden=true}
    else if(iOS)toast("In Safari, tap the Share button, then “Add to Home Screen”.");
    else toast("Open your browser menu and choose “Install app” or “Add to Home screen”.");
  });
})();
</script>
</body>
